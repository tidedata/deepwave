# Sui mainnet full node (a production configuration).
# Based on the official fullnode-template.yaml (mainnet branch) and the full
# node guide at docs.sui.io. Differences from the defaults are noted inline.

db-path: "/opt/sui/db"

network-address: "/dns/localhost/tcp/8080/http"
# Docs: keep metrics private. The template binds 0.0.0.0; this binds localhost.
metrics-address: "127.0.0.1:9184"
# gRPC and JSON-RPC API. Firewall it to trusted clients.
json-rpc-address: "0.0.0.0:9000"
enable-event-processing: true
# Legacy JSON-RPC indexes. The stack reads through gRPC (rpc.enable-indexing
# below), so these stay off to save disk, as the docs allow after migrating.
enable-index-processing: false

# Docs: required for the gRPC API's owned-object, balance and history queries.
rpc:
  enable-indexing: true
  ledger-history:
    list-transactions:
      timeout-ms: 5000
      default-limit-items: 50
      max-limit-items: 500
      chunk-max: 32
    list-events:
      timeout-ms: 5000
      default-limit-items: 50
      max-limit-items: 1000
      chunk-max: 32
    list-checkpoints:
      timeout-ms: 5000
      default-limit-items: 10
      max-limit-items: 100
      chunk-max: 16
    bitmap-bucket-scan-budget: 1024
    chunk-bucket-scan-budget: 256
    max-bitmap-filter-literals: 10

p2p-config:
  listen-address: "0.0.0.0:8084"
  # The box public IPv4, so peers can reach this node.
  external-address: "/ip4/203.0.113.8/udp/8084"
  seed-peers:
    - address: /dns/mel-00.mainnet.sui.io/udp/8084
      peer-id: d32b55bdf1737ec415df8c88b3bf91e194b59ee3127e3f38ea46fd88ba2e7849
    - address: /dns/ewr-00.mainnet.sui.io/udp/8084
      peer-id: c7bf6cb93ca8fdda655c47ebb85ace28e6931464564332bf63e27e90199c50ee
    - address: /dns/ewr-01.mainnet.sui.io/udp/8084
      peer-id: 3227f8a05f0faa1a197c075d31135a366a1c6f3d4872cb8af66c14dea3e0eb66
    - address: /dns/lhr-00.mainnet.sui.io/udp/8084
      peer-id: c619a5e0f8f36eac45118c1f8bda28f0f508e2839042781f1d4a9818043f732c
    - address: /dns/sui-mainnet-ssfn-1.nodeinfra.com/udp/8084
      peer-id: 0c52ca8d2b9f51be4a50eb44ace863c05aadc940a7bd15d4d3f498deb81d7fc6
    - address: /dns/sui-mainnet-ssfn-2.nodeinfra.com/udp/8084
      peer-id: 1dbc28c105aa7eb9d1d3ac07ae663ea638d91f2b99c076a52bbded296bd3ed5c
    - address: /dns/sui-mainnet-ssfn-ashburn-na.overclock.run/udp/8084
      peer-id: 5ff8461ab527a8f241767b268c7aaf24d0312c7b923913dd3c11ee67ef181e45
    - address: /dns/sui-mainnet-ssfn-dallas-na.overclock.run/udp/8084
      peer-id: e1a4f40d66f1c89559a195352ba9ff84aec28abab1d3aa1c491901a252acefa6
    - address: /dns/ssn01.mainnet.sui.rpcpool.com/udp/8084
      peer-id: fadb7ccb0b7fc99223419176e707f5122fef4ea686eb8e80d1778588bf5a0bcd
    - address: /dns/ssn02.mainnet.sui.rpcpool.com/udp/8084
      peer-id: 13783584a90025b87d4604f1991252221e5fd88cab40001642f4b00111ae9b7e

genesis:
  genesis-file-location: "/opt/sui/config/genesis.blob"

# The docs suggest 14 epochs of history on a 4 TB drive. This node has 3.75 TB
# and the stack only needs current state plus recent checkpoints, so it keeps
# two epochs of checkpoints and one of object history.
authority-store-pruning-config:
  num-latest-epoch-dbs-to-retain: 3
  epoch-db-pruning-period-secs: 3600
  num-epochs-to-retain: 1
  num-epochs-to-retain-for-checkpoints: 2
  max-checkpoints-in-batch: 10
  max-transactions-in-batch: 1000
  pruning-run-delay-seconds: 60

# Fallback for checkpoints peers no longer serve (template default for mainnet).
state-archive-read-config:
  - ingestion-url: "https://checkpoints.mainnet.sui.io"
    concurrency: 5
