[package]
name = "zui-truth-rpc-exec-driver"
version = "0.1.0"
edition = "2024"
publish = false
description = "ExecuteTransaction ground truth for zui: validator wire messages (sui-types messages_grpc), SuiError and TransactionDriverError texts, sui-rpc-api execute_transaction replies (mainnet-v1.83.1)"

# Standalone workspace; ../../sui is the Mysten tree (tools/setup-sui.sh). Shared target dir (tools/env.sh).
[workspace]

[dependencies]
sui-types = { path = "../../sui/crates/sui-types" }
sui-core = { path = "../../sui/crates/sui-core" }
sui-rpc-api = { path = "../../sui/crates/sui-rpc-api" }
consensus-types = { path = "../../sui/consensus/types" }
consensus-config = { path = "../../sui/consensus/config" }
move-core-types = { path = "../../sui/external-crates/move/crates/move-core-types" }
bcs = "0.1.4"
serde_json = { version = "1", features = ["preserve_order"] }
zstd = "0.13.2"
anyhow = "1"
hex = "0.4"
rayon = "1"
sui-rpc = { git = "https://github.com/MystenLabs/sui-rust-sdk.git", rev = "8c356d65b1c324590a3fd25990c382af308ea545", features = ["unstable"] }
prost = "0.14.1"
prost-types = "0.14.1"
tonic = "0.14.6"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

[profile.release]
debug = 1

[patch.crates-io]
h2 = { git = "https://github.com/nickvikeras/h2", rev = "44260b15da7d6cf15c241295a2d27917c157f4c8" }
