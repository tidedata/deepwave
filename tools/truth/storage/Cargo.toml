[package]
name = "zui-store-truth"
version = "0.1.0"
edition = "2024"
publish = false
description = "Storage-lane truth and RocksDB baseline for zui: store ops and live set from Mysten's sui-types, sui-node's typed-store RocksDB config for benches"

# Standalone workspace. ../../sui is the symlink made by tools/setup-sui.sh (Mysten mainnet-v1.83.1).
[workspace]

[dependencies]
sui-types = { path = "../../sui/crates/sui-types" }
typed-store = { path = "../../sui/crates/typed-store" }
bcs = "0.1.4"
serde = "1"
anyhow = "1"
hex = "0.4"
rayon = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[patch.crates-io]
h2 = { git = "https://github.com/nickvikeras/h2", rev = "44260b15da7d6cf15c241295a2d27917c157f4c8" }

[profile.release]
debug = 1
