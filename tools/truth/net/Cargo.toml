[package]
name = "zui-net-truth"
version = "0.1.0"
edition = "2024"
publish = false
description = "Ground truth for the zui net lane: anemo wire vectors, state-sync codec vectors, and a Rust anemo peer for interop"

# Standalone workspace. ../sui is the symlink made by tools/setup-sui.sh (Mysten mainnet-v1.83.1).
[workspace]

[dependencies]
anemo = { git = "https://github.com/mystenlabs/anemo.git", rev = "68adc31d4ea1f4573f08c2c75317fcb205b823de" }
mysten-network = { path = "../../sui/crates/mysten-network" }
sui-types = { path = "../../sui/crates/sui-types" }
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "da61cd46013fdd65361e57f7b9d4ae2244f86430" }
shared-crypto = { path = "../../sui/crates/shared-crypto" }
# sync-from: sui-node's own state-sync/discovery clients (anemo-build generated) and archive fetch.
sui-network = { path = "../../sui/crates/sui-network" }
sui-storage = { path = "../../sui/crates/sui-storage" }
sui-config = { path = "../../sui/crates/sui-config" }
object_store = "0.13"
futures = "0.3"
bcs = "0.1.4"
bincode = "1.3.3"
bytes = "1"
snap = "1"
tower = { version = "0.4.12", default-features = false, features = ["util"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.1", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
zstd = "0.13.2"
sha2 = "0.10"

[patch.crates-io]
h2 = { git = "https://github.com/nickvikeras/h2", rev = "44260b15da7d6cf15c241295a2d27917c157f4c8" }

[profile.release]
debug = 1
